[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoragml"
description = "Modalite-agnostik, deterministik AutoML çekirdeği (v1: tablo + zaman serisi). RAG/agent katmanı v2."
readme = "README.md"
requires-python = ">=3.11"  # enum.StrEnum, tomllib, exception groups
license = { text = "TBD" }  # proje lisansı kesinleşmedi — bkz. docs/architecture/decisions
authors = [{ name = "AutoRagML" }]
keywords = ["automl", "forecasting", "time-series", "tabular", "machine-learning"]
dynamic = ["version"]

# Çekirdek: torch YOK, hafif, 3 OS'te sorunsuz.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pydantic>=2.5",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
xgboost    = ["xgboost>=2.0"]
catboost   = ["catboost>=1.2"]
timeseries = ["statsforecast>=1.7"]           # v1: AutoARIMA/AutoETS/MSTL/Theta
hpo        = ["optuna>=3.5"]
tracking   = ["mlflow>=2.10"]
report     = ["jinja2>=3.1", "matplotlib>=3.7"]
explain    = ["shap>=0.44"]

# LLM sağlayıcıları (v2 RAG/agent katmanı için — çekirdek bunlara bağlı değil)
llm-openai    = ["openai>=1.30"]
llm-anthropic = ["anthropic>=0.40"]
llm-bedrock   = ["boto3>=1.34"]
llm-azure     = ["openai>=1.30"]
llm-local     = ["httpx>=0.27"]

# Ağır, tamamen opt-in — kendi venv'inde önerilir
autogluon = ["autogluon.tabular>=1.1", "autogluon.timeseries>=1.1"]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hatch>=1.12",
]

[project.scripts]
autoragml = "autoragml.interfaces.cli:main"

[tool.hatch.version]
path = "src/autoragml/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/autoragml"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["autoragml"]
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
