[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoragml"
description = "Modalite-agnostik, deterministik AutoML çekirdeği (v1: tablo + zaman serisi). RAG/agent katmanı v2."
readme = "README.md"
requires-python = ">=3.12"  # PEP 695, enum.StrEnum, modern stubs
license = { text = "TBD" }  # proje lisansı kesinleşmedi — bkz. docs/architecture/decisions
authors = [{ name = "AutoRagML" }]
keywords = ["automl", "forecasting", "time-series", "tabular", "machine-learning"]
dynamic = ["version"]

# Çekirdek: torch YOK, hafif, 3 OS'te sorunsuz.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "scipy>=1.11",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
db         = ["sqlalchemy>=2.0"]
xgboost    = ["xgboost>=2.0"]
catboost   = ["catboost>=1.2"]
interpret  = ["interpret-core>=0.6"]          # ADR 0040: EBM (cam-kutu GAM boosting)
ngboost    = ["ngboost>=0.5"]                 # ADR 0040: olasılıksal gradient boosting
timeseries = ["statsforecast>=1.7"]           # v1: AutoARIMA/AutoETS/CES/TBATS/Theta/IMAPA/ADIDA
hpo        = ["optuna>=3.5"]
tracking   = ["mlflow>=2.10"]
report     = ["matplotlib>=3.7"]           # HTML/MD/CSV bağımlılıksız; extra yalnız PNG grafikler
explain    = ["shap>=0.44"]
neural     = ["pytabkit>=1.7", "torch>=2.2"]   # ADR 0030: RealMLP + TabM (sklearn wrapper).
                                              # CUDA: pip install torch --index-url https://download.pytorch.org/whl/cu124
                                              # RealTabR ek: pip install skorch faiss-cpu
neural-nas = ["pytorch-tabular>=1.1"]          # ADR 0031: mimari arama (aile taraması + derin arama)
neural-ts  = ["neuralforecast>=1.7"]           # ADR 0032: NHITS/PatchTST/TFT/NBEATSx/iTransformer/TSMixer
foundation         = ["tabpfn>=2.5"]           # ADR 0033: TabPFN (in-context). TABPFN_TOKEN gerekir (.env)
foundation-ts      = ["chronos-forecasting>=2.1"]  # ADR 0033: Chronos-Bolt zero-shot (torch>=2.2,<3)
foundation-ts-timesfm = ["timesfm[torch]>=2.5"]    # ADR 0041: Google TimesFM 2.5 zero-shot

# LLM sağlayıcıları (v2 RAG/agent katmanı için — çekirdek bunlara bağlı değil)
llm-openai    = ["openai>=1.30"]
llm-anthropic = ["anthropic>=0.40"]
llm-bedrock   = ["boto3>=1.34"]
llm-azure     = ["openai>=1.30"]
llm-local     = ["httpx>=0.27"]

# Ağır, tamamen opt-in — kendi venv'inde önerilir
autogluon = ["autogluon.tabular>=1.1", "autogluon.timeseries>=1.1"]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hatch>=1.12",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
    "sqlalchemy>=2.0",
    "optuna>=3.5",
    "matplotlib>=3.7",
    "datasetsforecast>=0.0.8",   # benchmark 2. dalga (M3/Tourism/M5 panel)
]

[project.scripts]
autoragml = "autoragml.interfaces.cli:main"

[tool.hatch.version]
path = "src/autoragml/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/autoragml"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["autoragml"]
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pyarrow.*", "sklearn.*", "scipy.*", "joblib.*", "mlflow.*", "matplotlib.*",
    "torch.*", "pytabkit.*", "pytorch_tabular.*", "omegaconf.*", "neuralforecast.*",
    "tabpfn.*", "chronos.*", "transformers.*", "shap.*", "timesfm.*", "interpret.*", "ngboost.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::sklearn.exceptions.ConvergenceWarning",
    "ignore:.*eval_set.*:DeprecationWarning",
]
