description: >
  Foundation (in-context) tablo modelleri (ADR 0033 + 0040). `FoundationTabEstimator` sklearn
  sarımı (`__foundation_tab__`), yeni engine yok. Havuza yalnız `foundation_enabled` uygun + GPU
  + satır/öznitelik bandında girer (models/foundation_gate kapısı). HPO yok (in-context).
  Backend `default_params.backend`: `tabpfn` (lisans-kapılı `TABPFN_TOKEN` — VARSAYILAN KAPALI) |
  `tabicl` (soda-inria, permissive lisans, **token yok** — auth'suz HF indirmesi; clf + reg, v2).

tabpfn:
  name: TabPFN
  family: foundation
  class_path: __foundation_tab__          # models.estimator → FoundationTabEstimator (ADR 0033)
  modalities: [tabular, timeseries]       # forecasting: reduction lag-frame üstünde
  tasks: [regression, binary_classification, multiclass_classification]
  predict_kind: [point, proba]
  requires: [tabpfn]
  # KULLANICI KARARI (2026-09-03): TabPFN lisans/token kapılı ("ücretli") → **varsayılan KAPALI**,
  # aday listesinde görünmez. Açmak için: model_catalog_override YAML'ında `tabpfn: {enabled: true}`.
  enabled: false
  # n_estimators: TabPFN iç ensemble tekrar sayısı (hız/kalite dengesi). random_state sabit → determinist.
  default_params: {backend: tabpfn, random_state: 42, n_estimators: 4}

tabicl:
  name: TabICL
  family: foundation
  class_path: __foundation_tab__
  modalities: [tabular, timeseries]
  tasks: [regression, forecasting, binary_classification, multiclass_classification]
  predict_kind: [point, proba]
  requires: [tabicl]                      # auth'suz — TabPFN'e açık alternatif (ADR 0040)
  # HF ağırlık indirmesi (auth'suz ama ağ) + foundation family → varsayılan KAPALI (test/hızlı
  # koşum ağa bağlanmasın). Açmak: model_catalog_override `tabicl: {enabled: true}` + [foundation-tabicl].
  enabled: false
  default_params: {backend: tabicl, random_state: 42}
